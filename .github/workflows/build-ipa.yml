name: Build StylePort IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-ipa:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned archive
        run: |
          set -euo pipefail
          xcodebuild \
            -project StylePort.xcodeproj \
            -scheme StylePort \
            -sdk iphoneos \
            -configuration Release \
            -archivePath build/StylePort.xcarchive \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          set -euo pipefail
          rm -rf build/Payload build/StylePort.ipa
          mkdir -p build/Payload
          cp -R build/StylePort.xcarchive/Products/Applications/StylePort.app build/Payload/
          (cd build && zip -qry StylePort.ipa Payload)

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: StylePort-IPA
          path: build/StylePort.ipa
          if-no-files-found: error
          retention-days: 14
